site_name: Документация ClinicCore



site_url: https://TheTrueKingM.github.io/ClinicSolution-Learning/



repo_url: https://github.com/TheTrueKingM/ClinicSolution-Learning



repo_name: GitHub Repo



theme:



  name: material



  language: ru  



  features:



    - navigation.expand 



    - content.code.copy 



nav:
  - Главная: index.md

  - Руководство оператора (ГОСТ 19.505):
      - Титульный лист: gost/00-title.md
      - 1. Назначение программы: gost/01-purpose.md
      - 2. Условия выполнения: gost/02-conditions.md
      - 3. Выполнение программы: gost/03-execution.md
      - 4. Сообщения оператору: gost/04-messages.md

  - Справочник разработчика:
      - API Reference: developer/api.md

      markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

  plugins:
  - search

  - print-site:
      add_to_navigation: true
      print_page_title: "Печать документации (PDF)"

